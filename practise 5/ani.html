<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="ani.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">

</head>
<body>
    <div class="container">
        <div class="sub">
            <figure>
                    <img src="ts.png" alt="logo" title="login logo">
            </figure>
            <div class="more">
                <h2>Welcome Friend</h2>
                <p>To keep connect with us please
                   <span> login with ur personal info </span>
                </p>
                <button type="submit" onclick="alert('NO BACKEND')">SIGN IN</button>
            </div>
        </div>
        <div class="obj">
            <h2>CREATE ACCOUNT</h2>
            <SECTION class="in">
                <i class='bx bxl-facebook' style='color:#0000ff' ></i>
                <i class='bx bxl-instagram' style='color:rgba(181,5,122,0.9)'  ></i>
                <i class='bx bxl-twitter' style='color:rgba(24,19,191,0.78)' ></i>
            </SECTION>
            <P>or use email for registration</P>
            <form class="login">
                <label  for="name" class="name">
                    <i class='bx bxs-user'></i>
                   <input type="name" placeholder="NAME">
                </label>
 
                <label for="email" class="email">
                    <i class='bx bxs-envelope' ></i>
                    <input type="email" placeholder="EMAIL">             
                </label>

                <label for="password" class="password">
                    <i class='bx bxs-lock-alt' ></i>
                    <input type="password" placeholder="PASSWORD">
                </label>

                <button type="submit" onclick="alert('NO BACKEND')">SIGN UP</button>
            </form>
        </div>
    </div>
</body>
</html>
