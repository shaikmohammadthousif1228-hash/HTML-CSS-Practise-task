<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="k.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
</head>
<body>
    <div class="container">
        <section class="top">
            <i class='bx bx-left-arrow-alt' style='color:rgba(8,7,7,0.98)'  ></i>
            <i class='bx bx-dots-vertical'></i>
        </section>
        <section class="pic">
            <img src="k3.jpeg" alt="profile picture" width="200px" height="200px">
        </section>
        <section class="mid">
            <h2>Coding System</h2>
            <br>
            <h5>Web Developer & Designer</h5>
        </section>
        <section class="sub">
            <i class='bx bxl-facebook' style='color:#0000ff' ></i>
            <i class='bx bxl-instagram' style='color:rgba(181,5,122,0.9)'  ></i>
            <i class='bx bxl-twitter' style='color:rgba(24,19,191,0.78)' ></i>
            <i class='bx bxl-youtube' style='color:rgba(226,11,65,0.98)'  ></i>
        </section>
        <section class="but">
            <button type="submit" onclick="alert('NO BACKEND')">Follow</button>
            <button type="submit" onclick="alert('NO BACKEND')">Message</button>
        </section>
        <section class="fot">
            <i class='bx bx-heart' style='font-size: 20px;' style="border-right: 1px solid #000;" > 20.4k |</i>
            <i class='bx bx-comment' style='font-size: 20px;' style='border-right: 1px solid #000;'> 14.3k |</i>
            <i class='bx bx-share-alt' style='font-size: 20px;' style='border-right: 1px solid #000;'> 12.8k |</i>
        </section>
    </div>
</body>
</html>
