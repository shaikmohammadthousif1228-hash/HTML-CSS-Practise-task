<!DOCTYPE HTML>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=decive-width, initial-scale=1.0">
        <title>page</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu" />
        <link rel="stylesheet" href="pho.css">
        <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
        
    </head>
    <body>
        <div class="container">
                    <input type="radio" name="sidebar" id="home" checked>
                    <input type="radio" name="sidebar" id="blog">
                    <input type="radio" name="sidebar" id="code">
                    <input type="radio" name="sidebar" id="help">
                    <input type="radio" name="sidebar" id="about">
            <nav>
                <div class="sidebar"></div>
                <label for="home" class="home">
                    <i class='bx bxs-home'></i>
                    <h2>HOME</h2>
                </label>
                <label for="blog" class="blog">
                    <i class='bx bxl-blogger'></i>
                    <h2>BLOG</h2>
                </label>
                <label for="code" class="code">
                    <i class='bx bx-code-alt'></i>
                    <h2>CODE</h2>
                </label>
                <label for="help" class="help">
                    <i class='bx bxs-envelope'></i>
                    <h2>HELP</h2>
                </label>
                <label for="about" class="about">
                    <i class='bx bxs-user'></i>
                    <h2>ABOUT</h2>
                </label>
            </nav>
        </div>
    </body>
</html>
